name: buttons-ts004f-knob
components:
  - id: main
    capabilities:
      - id: button
        version: 1
      - id: knob
        version: 1
      - id: concertmirror08464.tsfKnobAction
        version: 1
      - id: concertmirror08464.tsfKnobMode
        version: 1
      - id: concertmirror08464.tsfKnobBrightnessDelta
        version: 1
      - id: concertmirror08464.tsfKnobStep
        version: 1
      - id: concertmirror08464.tsfKnobColorDelta
        version: 1
      - id: concertmirror08464.tsfKnobTransition
        version: 1
      - id: concertmirror08464.tsfKnobRate
        version: 1
      - id: battery
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Button
preferences:
  - preferenceId: stse.knobSensitivity
    explicit: true
  - name: knobEventStep
    title: "회전 단계 (%) / Rotation step (%)"
    description: "event 모드의 회전 신호 한 번에 적용할 상대 변화량 / Relative step per event-mode rotation."
    required: true
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 100
      default: 5
  - name: knobHeldMiredsPerPercent
    title: "눌러 회전 감도 / Held rotation scale"
    description: "command 모드에서 상대 1%에 해당하는 색온도 단계(mired). 값이 작을수록 민감합니다 / Mireds per 1% held step. Lower values increase sensitivity."
    required: true
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 65535
      default: 10
